spring.application.name=SLICGL_Inter_Bank_Transfer_Management
# MySQL Database Configuration
spring.datasource.url=${SLICLL_DB_URL}
spring.datasource.username=${SLICLL_DB_USER_NAME}
spring.datasource.password=${SLICLL_DB_PASSWORD}
# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate Configuration (JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
# Enable Liquibase for controlled migrations
spring.liquibase.enabled=true
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
frontend.url=${FRONTEND_URL}
# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.transaction=DEBUG
logging.level.SLICGL.example.SLICGL_Inter_Bant_Transfer_Management=DEBUG
server.servlet.session.timeout=15m

